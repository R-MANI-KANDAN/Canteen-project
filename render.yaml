services:
  - type: web
    name: licet-cafeteria
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn canteen_web.wsgi:application --chdir backend
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: licet-cafeteria-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: licet-cafeteria-db
    plan: free
    databaseName: licet_cafeteria
    user: licet_user
